name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tofu:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/tofu-ci.yml@9fd0907b20781556920e787822dfb1a1c7890151 # pre-release head of git-your-ship-together PR 151; re-pinned to its release tag before this merges
    permissions:
      contents: read
      id-token: write
    with:
      directories: "stacks/00-foundation stacks/10-access modules/vpc modules/firewall modules/twingate-connector"
      # tofu test in each directory; every test file mocks its providers, so
      # the job needs no credential, which is all a pull request may have.
      test: true
      # opa fmt, check --strict and test over the Spacelift push policy.
      policy-directories: .spacelift/policies

  python:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9fd0907b20781556920e787822dfb1a1c7890151 # pre-release head of git-your-ship-together PR 151; re-pinned to its release tag before this merges
    permissions:
      contents: read
      id-token: write
    with:
      python-versions: '["3.12", "3.13"]'
      install-command: pip install pytest
      # The cost gate first: it is a script in this repository, so it rides the
      # Python job rather than needing a job of its own.
      test-command: python -I scripts/cost_check.py --root . && python -I -m pytest tests -q
      lint-install-command: pip install ruff==0.17.0
      lint-command: ruff check scripts tests
      workflow-lint: false
      docker-build: false

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@9fd0907b20781556920e787822dfb1a1c7890151 # pre-release head of git-your-ship-together PR 151; re-pinned to its release tag before this merges
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: actions
      pip-audit-requirements: ""

  ci-green:
    name: CI green
    if: ${{ always() }}
    needs: [tofu, python, security]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a needed job finished as: $r"; exit 1; }
          done
