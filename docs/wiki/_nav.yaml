# SPDX-License-Identifier: Apache-2.0
# The wiki navigation manifest (issue #249). One entry per page, one line per entry.
#
# Adding a page = one line here, in the group where it belongs, plus its Glossary rows.
# Then run `python -I scripts/gen_wiki_nav.py` to rewrite docs/wiki/Contents.md and
# docs/wiki/_Sidebar.md; CI runs `python -I scripts/gen_wiki_nav.py --check`.
#
# Fields of a page entry:
#   page      the file name without .md (docs/wiki/<page>.md). Every wiki page appears once,
#             except the special pages _Sidebar and _Footer.
#   title     the short name shown in the sidebar and on Contents.
#   audience  one of: everyone, newcomer, learner, builder, engineer, operator, security reader.
#   status    optional, copied from the page's own banner, never invented:
#               draft       the banner says "unverified draft"
#               est. steps  the banner says the steps were written from reading and not run
#               unbuilt     the banner says the thing it describes is not built or not applied
#   desc      one line: what the page is for and who it is for.
#
# Groups: `curated` groups keep the order written here (a reading order); `sorted` groups
# are kept in title order (case-insensitive) so two additions rarely touch the same line.
# `links` are entries that point outside the wiki (they get no existence check).

groups:
  - {id: start, title: "Start here", order: curated}
  - {id: core, title: "Core path: read in this order", order: curated, numbered: true, open: true}
  - {id: os, title: "Foundations: OS and Linux", order: sorted}
  - {id: net, title: "Foundations: networking", order: curated}
  - {id: id, title: "Foundations: identity and secrets", order: sorted}
  - {id: iac, title: "Foundations: infrastructure as code", order: curated}
  - {id: web, title: "Foundations: web hosting", order: curated}
  - {id: tools, title: "Foundations: security tools and threat modeling", order: curated}
  - {id: defense, title: "Foundations: network and host defense", order: curated}
  - {id: deception, title: "Foundations: deception and honeypots", order: curated}
  - {id: detect, title: "Detection and monitoring", order: curated}
  - {id: enterprise, title: "Foundations: enterprise practice", order: curated}
  - {id: data, title: "Foundations: data governance", order: sorted}
  - {id: stages, title: "Stage guides and design", order: curated}
  - {id: clouds, title: "Other clouds", order: curated}
  - {id: reference, title: "Reference", order: sorted}
  - {id: process, title: "Project process", order: sorted}

