# SPDX-License-Identifier: Apache-2.0
# The wiki navigation manifest (issue #249). One entry per page, one line per entry.
#
# Adding a page = one line here, in the group where it belongs, plus its Glossary rows.
# Then run `python -I scripts/gen_wiki_nav.py` to rewrite docs/wiki/Contents.md,
# docs/wiki/_Sidebar.md and the page map on docs/wiki/Home.md (only the block between its
# BEGIN GENERATED PAGE MAP and END GENERATED PAGE MAP lines; the rest of Home is hand-written).
# CI runs `python -I scripts/gen_wiki_nav.py --check`.
#
# Fields of a page entry:
#   page      the file name without .md (docs/wiki/<page>.md). Every wiki page appears once,
#             except the special pages _Sidebar and _Footer.
#   title     the short name shown in the sidebar and on Contents.
#   audience  one of: everyone, newcomer, learner, builder, engineer, operator, security reader.
#   status    optional, copied from the page's own banner, never invented:
#               draft       the banner says "unverified draft"
#               est. steps  the banner says the steps were written from reading and not run
#               unbuilt     the banner says the thing it describes is not built or not applied
#   desc      one line: what the page is for and who it is for.
#   sidebar   optional, true or false: pin this page to the top of its group in the sidebar
#             (issues #362 and #378). The sidebar lists EVERY page of every group, one line
#             each, in collapsible groups, then a "Full list" link to the group's section of
#             Contents. Marked pages come first in display order, the rest follow in display
#             order, and nothing is dropped. The numbered core path is always listed in full,
#             in reading order. Keep marks to about 3 or 4 per group (the entry points and the
#             newest lessons). The sidebar costs one line per page and a test caps its length:
#             when that test fails, fold subgroups; do not raise the cap.
#
#   subgroup  optional text (issue #378): fold this page into a nested, collapsed block of its
#             group in the sidebar. Pages with no subgroup are listed first, one per line;
#             each subgroup follows (in order of first appearance) as one block whose rows pack
#             up to 5 links, and about 170 characters of visible text, per line, joined by a
#             middle dot. Pinned (sidebar: true) pages lead their subgroup. Not allowed on the
#             start group or the numbered core path. A block costs three lines plus its rows, so
#             fold groups of about 5 or more pages; the Home map and Contents ignore subgroups.
#             In a topic track (below) pages with no subgroup are listed before every subgroup in
#             the sidebar, and a pinned page also moves its subgroup up, so keep a track's pages
#             in reading order, unpinned, with the first page of each theme carrying the theme.
#   related   optional list of 3 to 6 page names (issue #417): the pages the "Related pages" list at
#             the bottom of this page shows, in this order. Each must exist in this file, none may be
#             the page itself and none may repeat. Choose pages the prose already points to or that
#             answer the next question a reader has; cross-track links are the point. A page with no
#             `related` list gets the fallback rule below.
#
# Page navigation blocks (issue #417): the generator writes two blocks on every page except Home,
# Contents, the special pages and the pages another generator writes whole (the status, growth and
# settings pages), each between a BEGIN GENERATED PAGE NAV and an END GENERATED PAGE NAV line (a
# "top" pair and a "bottom" pair). The top block sits after the page's first heading and its leading
# quote banners; it holds the breadcrumb (Home, the group, the page) and Previous and Next. The
# bottom block (end of the page) repeats Previous and Next, lists the group's pages (folded by
# subgroup) and shows the Related pages. Previous and Next follow the group's order and exist only
# in a group with a reading order: a numbered group (the core path, a track) in the order written, or
# a sorted group in title order; the first page has no Previous, the last no Next. The start and
# security tools groups have no reading order, so their pages get the breadcrumb and no neighbors.
# A page with no markers gets them inserted once; after that only the text between them is rewritten.
#
# In-page contents block (issue #441): a page whose own text (the generated blocks taken out) is over
# 300 lines also gets a third block, between BEGIN GENERATED PAGE CONTENTS and END GENERATED PAGE
# CONTENTS, right after the top navigation block. It is built from the page's headings, not from this
# file: a link to each "##" heading, and also each "###" heading (nested under its "##") on a page with
# fewer than 6 "##" headings. It adds no heading. Change the page's headings, then re-run the generator.
#
# Fallback rule for Related when a page has no `related` list: up to 4 other pages of the same group,
# not counting the Previous and Next page (shown beside it) in a group with a reading order. Pages of the
# same subgroup come first, then the rest of the group; within each, the nearest page in the group's order
# first, and the earlier of two equally near pages first. A group of one page has no Related list.
#
# Home page map: the generator also writes, on Home, a "Start here" line per kind of reader
# (the `readers` list at the bottom of this file), a line per topic track and per goal (the
# `goals` list at the bottom) and every page grouped like Contents with its desc. A page
# missing from this file cannot be left off Home, and a test fails if the generated block is
# stale.
#
# Groups: `curated` groups keep the order written here (a reading order); `sorted` groups
# are kept in title order (case-insensitive) so two additions rarely touch the same line.
# `links` are entries that point outside the wiki (they get no existence check).
#
# Topic tracks (issue #416): a group with `numbered: true` and `track: true` is a numbered,
# curated reading order on a topic (Contents and Home number its pages), and unlike the core
# path its sidebar block folds its pages into subgroups, one per theme. A page lives in one
# group only: a track holds its pages instead of a theme group, never in addition to one. The
# core path stays the read-this-to-build-the-project path; tracks are for reading by topic.

groups:
  - {id: start, title: "Start here", order: curated}
  - {id: core, title: "Core path: read in this order", order: curated, numbered: true, open: true}
  - {id: foundations, title: "Track 1: Foundations", order: curated, numbered: true, track: true}
  - {id: tools, title: "Security tools and threat modeling", order: curated}
  - {id: defend, title: "Track 2: Defend and detect", order: curated, numbered: true, track: true}
  - {id: privacy, title: "Track 3: Privacy, anonymity and cryptocurrency", order: curated, numbered: true, track: true}
  - {id: grc, title: "Track 4: GRC and law", order: curated, numbered: true, track: true}
  - {id: build, title: "Track 5: Build and operate", order: curated, numbered: true, track: true}
  - {id: reference, title: "Reference", order: sorted}

