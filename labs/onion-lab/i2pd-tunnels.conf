# i2pd HTTP server tunnel for the I2P version of the lab site (issue 391). Written from reading, not run.
# On the Debian and Ubuntu package, copy it to /etc/i2pd/tunnels.conf.d/onion-lab.conf and reload i2pd.
# The file named by "keys" is created by i2pd in its data directory the first time the tunnel starts. It holds the
# destination's private keys: whoever holds it IS this address. Never commit it, never paste its address anywhere public.
[onion-lab]
type = http
host = 127.0.0.1
port = 8080
keys = onion-lab.dat
