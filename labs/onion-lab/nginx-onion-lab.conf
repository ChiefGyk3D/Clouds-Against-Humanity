# The lab origin: an ordinary static web server, and nothing that knows it will be published.
# Copy to /etc/nginx/conf.d/onion-lab.conf on the lab VM, remove the packaged default site
# (/etc/nginx/sites-enabled/default listens on every interface), then check with: sudo nginx -t
#
# Loopback only. The same file serves the Tor and the I2P version of the site.
server_tokens off;

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/onion-lab/www;
    index index.html;

    # Logs stay on this machine. Every visit arrives from 127.0.0.1, because Tor and i2pd are the ones connecting.
    access_log /var/log/nginx/onion-lab.access.log;
    error_log /var/log/nginx/onion-lab.error.log warn;

    location / {
        try_files $uri =404;
    }

    # Our own error page: nginx's built-in one prints the word nginx (and its version when server_tokens is on).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
