# Synthetic demo only. The targets are a generator container, not real hosts.
# The instance labels in targets.json are documentation-range addresses.
# One job, as in the real design (stage 2 home-side runbook, section 5): each
# host has two entries, endpoint=node-exporter and endpoint=connector-metrics,
# and the entry's __metrics_path__ label picks the path on the generator.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/inventory.rules.yml
  - /etc/prometheus/alerts.rules.yml

scrape_configs:
  - job_name: twingate-ztna
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
